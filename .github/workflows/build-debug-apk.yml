name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Build phone + watch APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WardriveLite-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk

      - name: Publish to the "debug-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WardriveLite-debug.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk WardriveLite-watch-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest WardriveLite-debug.apk WardriveLite-watch-debug.apk \
            --title "Latest debug build" --notes "Debug APKs built from ${GITHUB_SHA::7}. Source: this repository (GPL-3.0)." --prerelease
